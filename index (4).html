<style>

.chip.on{background:var(--tint);border-color:var(--tint);color:#fff}
.note{border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--mute);margin-top:10px}
.tr{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:12px;cursor:pointer}

.th{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}

.mb{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:6px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.plc{border:1px solid var(--line);background:var(--surf);border-radius:18px;padding:16px;cursor:pointer;color:var(--ink);text-align:left;font:inherit}
.plc .ph{width:100%;aspect-ratio:1;border-radius:12px;margin-bottom:8px}
#mini{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;padding:0 10px}
#mini .in{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surf) 88%,var(--tint));border:1px solid var(--line);border-radius:18px;padding:8px 10px;cursor:pointer;backdrop-filter:blur(10px);position:relative;overflow:hidden}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--tint);width:0}
.rb{border:0;background:var(--tint);color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
nav{display:flex;border-top:1px solid var(--line);background:var(--surf);padding-bottom:env(safe-area-inset-bottom,0px);position:fixed;left:0;right:0;bottom:0}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 0 8px;font:500 12px "Outfit",sans-serif;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:20px}nav button.on{color:var(--tint)}

.disc::after{content:"";position:absolute;inset:47%;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.npt{width:100%;max-width:520px;text-align:center}.npt b{font-size:24px;font-weight:700;display:block}.npt span{color:var(--mute)}
#cv{width:100%;max-width:520px;height:70px;margin:8px 0}
.seek{width:100%;max-width:520px}.seek input{width:100%;accent-color:var(--tint)}.seek div{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0}
.ctl button{border:0;background:none;color:var(--ink);font-size:24px;cursor:pointer}.ctl .on{color:var(--tint)}
.ctl .big{background:var(--tint);color:#fff;width:68px;height:68px;border-radius:50%;font-size:28px}
.eq{display:flex;gap:6px;justify-content:center;width:100%;max-width:520px;margin:8px 0}
.eq div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute)}
.eq input{writing-mode:vertical-lr;direction:rtl;height:110px;accent-color:var(--tint);width:22px}
.panel{width:100%;max-width:520px}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(5,3,15,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{width:100%;max-width:520px;background:var(--surf);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
#sheet button.it{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:13px 6px;font:500 16px "Outfit",sans-serif;cursor:pointer;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:60;font-weight:500}
button:focus-visible,input:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
</style>
</head>

 if(t.src==="local"){var b=BLOBS[t.id]||await getBlob(t.id);if(!b){toast("That file isn’t stored any more. Add it again.");return}URLS[t.id]=URLS[t.id]||URL.createObjectURL(b);A1.src=URLS[t.id]}
 else A1.src=AU+"/tracks/"+t.aid+"/stream?app_name="+APP;
 A1.playbackRate=P.spd;A1.volume=P.vol;setTint(t);ui();media();if(go){resume();A1.play().catch(function(){})}}
function bind(a){a.addEventListener("timeupdate",function(){if(a!==el)return;var d=a.duration||S.cur&&S.cur.dur||0,p=d?a.currentTime/d:0;$("mbar").style.width=p*100+"%";if(S.np){$("tc").textContent=fmt(a.currentTime);$("td").textContent=fmt(d);if(!seeking)$("sk").value=Math.round(p*1000)}});
 a.addEventListener("ended",function(){if(a===el)next(true)});a.addEventListener("play",ui);a.addEventListener("pause",ui)}
bind(A1);bind(A2);
A1.addEventListener("error",function(){var t=S.cur;if(!t||t.src==="local"||A1.dataset.fb)return;A1.dataset.fb="1";el=A2;A2.src=AU+"/tracks/"+t.aid+"/stream?app_name="+APP;A2.playbackRate=P.spd;A2.volume=P.vol;A2.play().catch(function(){});ui()});
A2.addEventListener("error",function(){toast("Couldn’t play that song. Try another.")});
function toggle(){if(!S.cur)return;if(el.paused){resume();el.play().catch(function(){})}else el.pause()}
function playList(list,i){S.queue=list.slice();S.qi=i;S.hist=[];loadTrack(S.queue[i],true);addRec(S.queue[i])}
function next(auto){if(!S.queue.length)return;var n=S.qi;if(P.rp===2&&auto){el.currentTime=0;el.play();return}
 if(P.sh&&S.queue.length>1){do{n=Math.floor(Math.random()*S.queue.length)}while(n===S.qi)}else{n=S.qi+1;if(n>=S.queue.length){if(P.rp===1||!auto)n=0;else{el.pause();el.currentTime=0;return}}}
 S.hist.push(S.qi);S.qi=n;loadTrack(S.queue[n],true);addRec(S.queue[n])}
function prev(){if(el.currentTime>3||(!S.hist.length&&S.qi<=0)){el.currentTime=0;return}S.qi=Math.max(0,S.hist.length?S.hist.pop():S.qi-1);loadTrack(S.queue[S.qi],true)}
function media(){if(!("mediaSession" in navigator)||!S.cur)return;try{var m=navigator.mediaSession;m.metadata=new MediaMetadata({title:S.cur.title,artist:S.cur.artist,album:S.cur.album||"Aurora",artwork:S.cur.art?[{src:S.cur.art,sizes:"480x480"}]:[]});m.setActionHandler("play",toggle);m.setActionHandler("pause",toggle);m.setActionHandler("previoustrack",prev);m.setActionHandler("nexttrack",function(){next(false)});m.setActionHandler("seekto",function(e){el.currentTime=e.seekTime})}catch(e){}}
/* ---- player UI ---- */
var seeking=false;
function ui(){var t=S.cur,pl=t&&!el.paused;$("mini").hidden=!t;if(!t)return;
 $("miniart").innerHTML=art(t,"th");$("mt").textContent=t.title;$("ma").textContent=t.artist;$("mp").textContent=pl?"❚❚":"▶";$("pp").textContent=pl?"❚❚":"▶";
 $("disc").innerHTML=art(t,"x");$("disc").classList.toggle("playing",pl);$("nt").textContent=t.title;$("na").textContent=t.artist;$("lk").textContent=liked(t)?"♥ Liked":"♡ Like";
 $("shb").classList.toggle("on",!!P.sh);$("rpb").classList.toggle("on",P.rp>0);$("rpb").textContent=P.rp===2?"🔂":"🔁";$("spd").textContent=P.spd+"×";
 document.querySelectorAll(".tr").forEach(function(r){var c=CTX[r.dataset.c];r.classList.toggle("cur",!!(c&&c[+r.dataset.i]&&c[+r.dataset.i].id===t.id))})}
function openNP(){if(!S.cur)return;S.np=true;$("np").hidden=false;ui();viz()}
function closeNP(){S.np=false;$("np").hidden=true}
function viz(){if(!S.np)return;requestAnimationFrame(viz);var c=$("cv"),x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);if(!G.an||el!==A1||el.paused)return;var d=new Uint8Array(G.an.frequencyBinCount);G.an.getByteFrequencyData(d);var n=48,bw=w/n;x.fillStyle=TINT;for(var i=0;i<n;i++){var v=d[Math.floor(i*d.length*.8/n)]/255,bh=Math.max(3,v*h);x.fillRect(i*bw+1,h-bh,bw-2,bh)}}
function showPanel(p){S.panel=S.panel===p?"":p;var e=$("panel");e.hidden=!S.panel;if(S.panel==="eq"){e.innerHTML='<div class="row">'+Object.keys(PRE).map(function(k){return '<button class="chip" data-pre="'+k+'">'+k+'</button>'}).join("")+'</div><div class="eq">'+BANDS.map(function(f,i){return '<div><input type="range" class="eqs" min="-12" max="12" step="1" value="'+P.eq[i]+'" data-b="'+i+'" aria-label="'+f+' Hz"><span>'+(f>=1000?f/1000+"k":f)+'</span></div>'}).join("")+'</div>'+(el===A2?'<p class="mute">Effects aren’t available for this online song.</p>':"")}
 else if(S.panel==="q"){e.innerHTML=S.queue.length?S.queue.map(function(t,i){return '<div class="tr'+(i===S.qi?" cur":"")+'" data-qi="'+i+'">'+art(t,"th")+'<div class="ti"><b>'+esc(t.title)+'</b><span>'+esc(t.artist)+'</span></div><button class="mb" data-qx="'+i+'" aria-label="Remove">✕</button></div>'}).join(""):'<p class="mute">The queue is empty.</p>'}}
function sheet(h){$("sheet").innerHTML='<div class="in">'+h+'</div>';$("sheet").hidden=false}
function hideSheet(){$("sheet").hidden=true}
var MT=null,MC="";
function menu(ctx,i){var t=CTX[ctx][i];MT=t;MC=ctx+":"+i;sheet('<b style="display:block;padding:4px 6px 10px">'+esc(t.title)+'</b><button class="it" data-sa="next">Play next</button><button class="it" data-sa="queue">Add to queue</button><button class="it" data-sa="like">'+(liked(t)?"Remove from liked":"Like")+'</button><button class="it" data-sa="addpl">Add to playlist…</button>'+(ctx==="pl"?'<button class="it" data-sa="rmpl">Remove from this playlist</button>':"")+(t.src==="local"?'<button class="it" data-sa="del">Delete from library</button>':"")+'<button class="it" data-sa="x">Cancel</button>')}
function newPl(){var n=prompt("Playlist name");if(!n||!n.trim())return null;var id="p"+Date.now();P.pl[id]={n:n.trim().slice(0,40),t:[]};sv();return id}
async function sheetAct(a){var t=MT;hideSheet();if(!t&&a!=="x")return;
 if(a==="next"){S.queue.splice(S.qi+1,0,t);toast("Playing next")}
 else if(a==="queue"){S.queue.push(t);if(S.qi<0){S.qi=0;loadTrack(t,true)}toast("Added to queue")}
 else if(a==="like"){if(liked(t))delete P.fav[t.id];else P.fav[t.id]=ref(t);sv();ui();if(S.tab==="lib"&&S.sub==="liked")render()}
 else if(a==="addpl"){var ks=Object.keys(P.pl);sheet('<b style="display:block;padding:4px 6px 10px">Add to playlist</b>'+ks.map(function(k){return '<button class="it" data-pa="'+k+'">'+esc(P.pl[k].n)+'</button>'}).join("")+'<button class="it" data-pa="new">＋ New playlist</button>')}
 else if(a==="rmpl"){var p=P.pl[S.pid];if(p){p.t=p.t.filter(function(r){return r.id!==t.id});sv();render()}}
 else if(a==="del"){if(!confirm("Delete “"+t.title+"” from your library?"))return;S.lib=S.lib.filter(function(x){return x.id!==t.id});delete P.fav[t.id];try{await tx("meta","readwrite",function(s){return s.delete(t.id)});await tx("blob","readwrite",function(s){return s.delete(t.id)})}catch(e){}render()}}
/* ---- events ---- */
document.addEventListener("click",function(e){var el2=e.target.closest("button,.tr,.plc,#minin");if(!el2)return;var d=el2.dataset;
 if(d.t){S.tab=d.t;S.pid=null;render();return}
 if(d.m){var p=d.m.split(":");menu(p[0],+p[1]);return}
 if(el2.classList.contains("tr")&&d.c){var l=CTX[d.c];if(l)playList(l,+d.i);return}
 if(el2.classList.contains("tr")&&d.qi!==undefined){S.qi=+d.qi;loadTrack(S.queue[S.qi],true);showPanel("q");showPanel("q");return}
 if(d.qx!==undefined){S.queue.splice(+d.qx,1);if(+d.qx<S.qi)S.qi--;showPanel("q");showPanel("q");return}
 if(d.g){S.genre=d.g;S.q="";S.disc=[];render();return}
 if(d.s){S.sub=d.s;render();return}
 if(d.p){S.pid=d.p;render();return}
 if(d.a==="plx"){S.pid=null;render();return}
 if(d.a==="pln"){newPl();render();return}
 if(d.a==="pld"){if(confirm("Delete this playlist?")){delete P.pl[S.pid];S.pid=null;sv();render()}return}
 if(d.a==="plp"||d.a==="pls"){var l2=P.pl[S.pid].t.map(deref).filter(Boolean);if(!l2.length)return;if(d.a==="pls")P.sh=1;playList(l2,d.a==="pls"?Math.floor(Math.random()*l2.length):0);return}
 if(d.sa){sheetAct(d.sa);return}
 if(d.pa){var id=d.pa==="new"?newPl():d.pa;if(id&&MT){P.pl[id].t.push(ref(MT));sv();toast("Added to “"+P.pl[id].n+"”")}hideSheet();return}
 if(d.pre){P.eq=PRE[d.pre].slice();sv();if(G.f)G.f.forEach(function(f,i){f.gain.value=P.eq[i]});showPanel("eq");showPanel("eq");return}
 if(el2.id==="minin"||el2.closest&&el2.closest("#minin")&&el2.id!=="mp"){openNP();return}
});
$("mp").onclick=function(e){e.stopPropagation();toggle()};$("pp").onclick=toggle;$("nx").onclick=function(){next(false)};$("pv").onclick=prev;
$("npx").onclick=closeNP;$("npq").onclick=function(){showPanel("q")};$("eqb").onclick=function(){showPanel("eq")};
$("shb").onclick=function(){P.sh=P.sh?0:1;sv();ui()};$("rpb").onclick=function(){P.rp=(P.rp+1)%3;sv();ui()};
$("lk").onclick=function(){if(!S.cur)return;if(liked(S.cur))delete P.fav[S.cur.id];else P.fav[S.cur.id]=ref(S.cur);sv();ui()};
$("spd").onclick=function(){var s=[.75,1,1.25,1.5,2],i=(s.indexOf(P.spd)+1)%s.length;P.spd=s[i];A1.playbackRate=A2.playbackRate=P.spd;sv();ui()};
$("slp").onclick=function(){var o=[0,15,30,60],i=(o.indexOf(S.sl||0)+1)%o.length;S.sl=o[i];clearTimeout(sleepT);$("slp").textContent=S.sl?"Sleep: "+S.sl+" min":"Sleep: off";if(S.sl)sleepT=setTimeout(function(){el.pause();S.sl=0;$("slp").textContent="Sleep: off";toast("Sleep timer ended")},S.sl*6e4)};
$("sk").addEventListener("input",function(){seeking=true;var d=el.duration||(S.cur&&S.cur.dur)||0;$("tc").textContent=fmt(d*this.value/1000)});
$("sk").addEventListener("change",function(){var d=el.duration||(S.cur&&S.cur.dur)||0;if(d)el.currentTime=d*this.value/1000;seeking=false});
$("sheet").addEventListener("click",function(e){if(e.target===$("sheet"))hideSheet()});
document.addEventListener("input",function(e){var t=e.target;
 if(t.classList&&t.classList.contains("eqs")){var i=+t.dataset.b;P.eq[i]=+t.value;if(G.f)G.f[i].gain.value=P.eq[i];sv()}
 if(t.id==="q"){S.q=t.value;clearTimeout(S.dt);S.dt=setTimeout(loadDisc,450)}
 if(t.id==="lf"){S.lf=t.value;$("lres").innerHTML=lres()}});
document.addEventListener("change",function(e){if(e.target.id==="file"||e.target.id==="file2"||e.target.id==="dir"){addFiles(Array.prototype.slice.call(e.target.files));e.target.value=""}});
document.addEventListener("keydown",function(e){var t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA")return;
 if(e.key===" "){e.preventDefault();toggle()}else if(e.key==="ArrowRight")el.currentTime+=5;else if(e.key==="ArrowLeft")el.currentTime-=5;else if(e.key==="n")next(false);else if(e.key==="p")prev();else if(e.key==="m")el.muted=!el.muted});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});

(async function(){try{var m=await tx("meta","readonly",function(s){return s.getAll()});S.lib=(m||[]).sort(function(a,b){return a.id<b.id?-1:1})}catch(e){S.lib=[]}
 if(S.lib.length)S.tab="lib";render()})();
