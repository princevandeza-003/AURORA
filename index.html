<style>

.npt{width:100%;max-width:520px;text-align:center}.npt b{font-size:24px;font-weight:700;display:block}.npt span{color:var(--mute)}

.ll{padding:6px 0;color:var(--mute);font-size:18px;cursor:pointer;transition:color .2s}.ll.on{color:var(--ink);font-weight:700;font-size:20px}
#panel{max-height:240px;overflow:auto;position:relative}

#xfn{accent-color:var(--tint)}
</style>
</head>
